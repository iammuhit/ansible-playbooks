---

- name: Webserver Provisioning
  hosts: webservers
  become: true

  tasks:
    - name: Install Nginx Web Server
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true

    - name: Start and Enable Nginx Service
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Deploy Custom Nginx Configuration
      ansible.builtin.template:
        src: templates/nginx/web.example.com.conf.j2
        dest: /etc/nginx/conf.d/web.example.com.conf
        mode: '0644'
      notify:
        - Reload Nginx

    - name: Install PHP and Required Extensions
      ansible.builtin.apt:
        name:
          - php8.1-fpm
          - php-mysql
          - php-curl
          - php-gd
          - php-mbstring
          - php-xml
          - php-zip
          - php-cli
        state: present
      notify:
        - Reload Nginx

    - name: Start and Enable PHP-FPM Service
      ansible.builtin.service:
        name: php8.1-fpm
        state: started
        enabled: true

  handlers:
    - name: Reload Nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
