---

- name: Webserver Provisioning
  hosts: webservers
  become: true

  tasks:
    - name: Install Nginx Web Server
      ansible.builtin.apt:
        name: nginx
        state: present

    - name: Start and Enable Nginx Service
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Deploy Custom Nginx Configuration
      ansible.builtin.template:
        src: templates/nginx/web.example.com.conf.j2
        dest: /etc/nginx/conf.d/web.example.com.conf
        mode: '0644'
      notify:
        - Reload Nginx

  handlers:
    - name: Reload Nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
