---

- name: Webserver Provisioning
  hosts: webservers
  become: true

  tasks:
    - name: Install Nginx Web Server
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true

    - name: Start and Enable Nginx Service
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Deploy Custom Nginx Configuration
      ansible.builtin.template:
        src: templates/nginx/web.example.com.conf.j2
        dest: /etc/nginx/conf.d/web.example.com.conf
        mode: '0644'
      notify:
        - Reload Nginx

    - name: Install PHP and Required Extensions
      ansible.builtin.apt:
        name:
          - php8.1-fpm
          - php-mysql
          - php-curl
          - php-gd
          - php-mbstring
          - php-xml
          - php-zip
          - php-cli
        state: present
      notify:
        - Reload Nginx

    - name: Start and Enable PHP-FPM Service
      ansible.builtin.service:
        name: php8.1-fpm
        state: started
        enabled: true

  handlers:
    - name: Reload Nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded

- name: Database Server Provisioning
  hosts: dbservers
  become: true

  tasks:
    - name: Install MariaDB Server
      ansible.builtin.dnf:
        name: mariadb-server
        state: present
        update_cache: true

    - name: Install PyMySQL for Python MySQL Modules
      ansible.builtin.pip:
        name: PyMySQL
        executable: pip3

    - name: Start and Enable MariaDB Service
      ansible.builtin.service:
        name: mariadb
        state: started
        enabled: true

    - name: Configure Root Password
      community.mysql.mysql_user:
        check_implicit_admin: true
        update_password: always
        name: '{{ mariadb_root_user }}'
        password: '{{ mariadb_root_password }}'

        login_user: '{{ mariadb_root_user }}'
        login_password: '{{ mariadb_root_password }}'
        login_unix_socket: /var/lib/mysql/mysql.sock
        state: present

    - name: Create Application Database
      community.mysql.mysql_db:
        name: '{{ mariadb_database | default("app_database") }}'
        login_user: '{{ mariadb_root_user }}'
        login_password: '{{ mariadb_root_password }}'
        state: present

    - name: Create Application Database User
      community.mysql.mysql_user:
        name: '{{ mariadb_user }}'
        password: '{{ mariadb_password }}'
        priv: '{{ mariadb_database }}.*:ALL'
        login_user: '{{ mariadb_root_user }}'
        login_password: '{{ mariadb_root_password }}'
        state: present
